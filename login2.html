<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Namma BLR</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF6B2B;
            --orange-soft: #FF8C52;
            --gold: #C9A84C;
            --cream: #F5EDD8;
            --dark: #0E0C0A;
            --dark2: #1A1612;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: var(--dark);
            overflow: hidden;
            display: flex;
        }

        /* ── BG IMAGE SIDE ── */
        .bg-panel {
            position: relative;
            width: 55%;
            overflow: hidden;
        }

        .bg-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://s7ap1.scene7.com/is/image/incredibleindia/nandi-hills-bangalore-karnataka-attr-about?qlt=82') center/cover no-repeat;
            transform: scale(1.05);
            animation: slowZoom 20s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1.05); }
            to   { transform: scale(1.12); }
        }

        .bg-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                105deg,
                rgba(14,12,10,0.15) 0%,
                rgba(14,12,10,0.4) 60%,
                rgba(14,12,10,0.92) 100%
            );
        }

        .bg-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 56px 52px;
        }

        .brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,107,43,0.18);
            border: 1px solid rgba(255,107,43,0.35);
            border-radius: 100px;
            padding: 6px 16px;
            margin-bottom: 28px;
            width: fit-content;
        }

        .brand-tag .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--orange);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(1.4); }
        }

        .brand-tag span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--orange-soft);
        }

        .bg-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(42px, 5vw, 68px);
            font-weight: 900;
            color: var(--cream);
            line-height: 1.05;
            margin-bottom: 16px;
        }

        .bg-content h1 em {
            font-style: italic;
            color: var(--orange);
        }

        .bg-content p {
            font-size: 15px;
            color: rgba(245,237,216,0.6);
            line-height: 1.7;
            max-width: 340px;
            font-weight: 300;
        }

        .divider-line {
            width: 48px;
            height: 2px;
            background: var(--gold);
            margin: 20px 0;
            border-radius: 2px;
        }

        /* ── FORM SIDE ── */
        .form-panel {
            width: 45%;
            background: var(--dark2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 48px;
            position: relative;
            overflow: hidden;
        }

        .form-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
        }

        .form-panel::after {
            content: '';
            position: absolute;
            top: -120px; right: -80px;
            width: 340px; height: 340px;
            background: radial-gradient(circle, rgba(255,107,43,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .form-wrap {
            width: 100%;
            max-width: 340px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 36px;
            letter-spacing: -0.3px;
        }

        .form-logo span { color: var(--orange); }

        .form-wrap h2 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 6px;
        }

        .form-wrap .sub {
            font-size: 13px;
            color: rgba(245,237,216,0.45);
            margin-bottom: 28px;
            font-weight: 300;
        }

        /* toggle admin/user */
        .toggle-group {
            display: flex;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
            gap: 4px;
        }

        .toggle-group button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: rgba(245,237,216,0.4);
            transition: all 0.25s;
        }

        .toggle-group button.active {
            background: var(--orange);
            color: white;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(245,237,216,0.45);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: var(--cream);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .field input::placeholder { color: rgba(245,237,216,0.2); }

        .field input:focus {
            border-color: var(--orange);
            background: rgba(255,107,43,0.06);
        }

        .field .error {
            display: block;
            margin-top: 5px;
            font-size: 11px;
            color: #ff6b6b;
            min-height: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            margin-top: -6px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(245,237,216,0.4);
            cursor: pointer;
        }

        .remember input[type="checkbox"] {
            accent-color: var(--orange);
            width: 14px; height: 14px;
        }

        .banner {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 14px;
            display: none;
        }
        .banner.error { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); color: #ff8a8a; display: block; }
        .banner.success { background: rgba(80,200,120,0.12); border: 1px solid rgba(80,200,120,0.3); color: #6ee08a; display: block; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--orange);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s, transform 0.15s;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .submit-btn:hover { background: var(--orange-soft); transform: translateY(-1px); }
        .submit-btn:hover::after { transform: translateX(100%); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: rgba(245,237,216,0.35);
        }

        .signup-text a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-text a:hover { text-decoration: underline; }

        .city-strip {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--orange), var(--gold), var(--orange), transparent);
        }
    </style>
</head>
<body>

<!-- LEFT: BG IMAGE -->
<div class="bg-panel">
    <div class="bg-content">
        <div class="brand-tag">
            <div class="dot"></div>
            <span>Namma BLR</span>
        </div>
        <h1>Your City,<br><em>Your Way.</em></h1>
        <div class="divider-line"></div>
        <p>Discover the best of Bengaluru — from rooftop dining to hidden hotspots, all in one place.</p>
    </div>
</div>

<!-- RIGHT: FORM -->
<div class="form-panel">
    <div class="form-wrap">

        <div class="form-logo">Namma<span>BLR</span></div>

        <h2 id="formTitle">Welcome back</h2>
        <p class="sub" id="formSub">Sign in to manage your city experience</p>

        <!-- Admin / User toggle -->
        <div class="toggle-group">
            <button id="adminBtn" onclick="switchMode('admin')">Admin</button>
            <button class="active" id="userBtn" onclick="switchMode('user')">User</button>
        </div>

        <div class="banner" id="banner"></div>

        <form id="loginForm">
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <small class="error" id="passwordError"></small>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>

            <p class="signup-text">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </form>

    </div>
    <div class="city-strip"></div>
</div>

<script>
    let currentMode = 'user';

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('adminBtn').classList.toggle('active', mode === 'admin');
        document.getElementById('userBtn').classList.toggle('active', mode === 'user');
        document.getElementById('formTitle').textContent = mode === 'admin' ? 'Admin Portal' : 'Welcome back';
        document.getElementById('formSub').textContent = mode === 'admin'
            ? 'Sign in to manage the city experience'
            : 'Hello, Explorer. Sign in to discover BLR';
        clearErrors();
    }

    function clearErrors() {
        document.getElementById('emailError').textContent = '';
        document.getElementById('passwordError').textContent = '';
        hideBanner();
    }

    function showBanner(msg, type) {
        const b = document.getElementById('banner');
        b.textContent = msg;
        b.className = 'banner ' + type;
    }

    function hideBanner() {
        document.getElementById('banner').className = 'banner';
    }

    // Pre-fill from localStorage if remember me was set
    window.addEventListener('DOMContentLoaded', () => {
        const saved = localStorage.getItem('namma_remember');
        if (saved) {
            const { email, mode } = JSON.parse(saved);
            document.getElementById('email').value = email || '';
            document.getElementById('rememberMe').checked = true;
            if (mode) switchMode(mode);
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        clearErrors();

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('rememberMe').checked;

        let valid = true;
        if (!/^[^\s]+@[^\s]+\.[a-z]{2,}$/.test(email)) {
            document.getElementById('emailError').textContent = 'Enter a valid email address.';
            valid = false;
        }
        if (!password) {
            document.getElementById('passwordError').textContent = 'Password is required.';
            valid = false;
        }
        if (!valid) return;

        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Signing in…';
        btn.disabled = true;

        try {
            const res = await fetch('http://localhost/NammaHub/api/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, mode: currentMode })
            });

            const data = await res.json();

            if (!res.ok) {
                showBanner(data.error || 'Invalid credentials.', 'error');
                btn.textContent = 'Sign in';
                btn.disabled = false;
                return;
            }

            // Handle remember me
            if (remember) {
                localStorage.setItem('namma_remember', JSON.stringify({ email, mode: currentMode }));
            } else {
                localStorage.removeItem('namma_remember');
            }

            sessionStorage.setItem('namma_user', JSON.stringify(data.user));

            showBanner('Signed in! Redirecting…', 'success');

            setTimeout(() => {
                window.location.href = 'landing page2.html';
            }, 800);

        } catch (err) {
            showBanner('Server unreachable. Is XAMPP running?', 'error');
            btn.textContent = 'Sign in';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
